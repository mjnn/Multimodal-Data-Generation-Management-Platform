# Rosbag HMI — Nginx 反向代理
#
# 安装（ECS）：
#   bash deploy/install-nginx-rosbag-labels.sh
#
# 在 /etc/nginx/sites-enabled/default 的 server {} 内、
# ecs-service-manage-generated-locations.conf 之前加入：
#   include /etc/nginx/snippets/rosbag-labels-locations.conf;
#
# 后端：127.0.0.1:8012（compose HOST_PORT）
# 公网：http://47.116.180.173/tools/rosbag-labels/
#
# 批量上传多个 bag 常 >500MB；body/timeout 需覆盖整批 multipart。

location = /tools/rosbag-labels {
    return 301 /tools/rosbag-labels/;
}

location = /tools/rosbag-labels/api/health {
    proxy_pass http://127.0.0.1:8012/api/health;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
}

location /tools/rosbag-labels/ {
    # ~1GB+ 多 bag 批次；过小会 413，浏览器 axios 常显示 Network Error
    client_max_body_size 4g;
    proxy_pass http://127.0.0.1:8012/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Prefix /tools/rosbag-labels;
    proxy_connect_timeout 10s;
    # 大文件上传/落盘可能很久，勿用过短 send/read timeout
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    # 上传流式转发，避免 nginx 先整包缓冲再转发（大 body 占盘/易超时）
    proxy_request_buffering off;
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;
}
